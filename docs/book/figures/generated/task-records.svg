;color:#182c28;}#diagram-task-records .cluster-label text{fill:#000000;}#diagram-task-records .cluster-label span{color:#000000;}#diagram-task-records .cluster-label span p{background-color:transparent;}#diagram-task-records .label text,#diagram-task-records span{fill:#182c28;color:#182c28;}#diagram-task-records .node rect,#diagram-task-records .node circle,#diagram-task-records .node ellipse,#diagram-task-records .node polygon,#diagram-task-records .node path{fill:#edf3f1;stroke:#42665d;stroke-width:1px;}#diagram-task-records .rough-node .label text,#diagram-task-records .node .label text,#diagram-task-records .image-shape .label,#diagram-task-records .icon-shape .label{text-anchor:middle;}#diagram-task-records .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagram-task-records .rough-node .label,#diagram-task-records .node .label,#diagram-task-records .image-shape .label,#diagram-task-records .icon-shape .label{text-align:center;}#diagram-task-records .node.clickable{cursor:pointer;}#diagram-task-records .root .anchor path{fill:#405952!important;stroke-width:0;stroke:#405952;}#diagram-task-records .arrowheadPath{fill:#0b0b0b;}#diagram-task-records .edgePaths .path{stroke:#405952;stroke-width:1px;}#diagram-task-records .flowchart-link{stroke:#405952;fill:none;}#diagram-task-records .edgeLabel{background-color:#ffffff;text-align:center;}#diagram-task-records .edgeLabel p{background-color:#ffffff;}#diagram-task-records .edgeLabel rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#diagram-task-records .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#diagram-task-records .cluster rect{fill:#ffffff;stroke:hsl(0, 0%, 90%);stroke-width:1px;}#diagram-task-records .cluster text{fill:#000000;}#diagram-task-records .cluster span{color:#000000;}#diagram-task-records .node .collapsed-indicator{fill:hsl(0, 0%, 90%);stroke:none;opacity:0.6;}#diagram-task-records .node .collapsed-separator{stroke:hsl(0, 0%, 90%);stroke-width:0.75px;}#diagram-task-records div