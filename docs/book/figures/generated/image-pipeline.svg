<svg id="diagram-image-pipeline" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 456px; background-color: white;" viewBox="4 4 456 557" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-diagram-image-pipeline" aria-labelledby="chart-title-diagram-image-pipeline"><title id="chart-title-diagram-image-pipeline">画像から表示までの仕事</title><desc id="chart-desc-diagram-image-pipeline">圧縮画像は復号と形式変換を経て画素になる。生画素も描画へ渡り、Canvas、フレームバッファ、DMAを経てパネルへ届く。</desc><style>#diagram-image-pipeline{font-family:Hiragino Kaku Gothic ProN,Noto Sans CJK JP,sans-serif;font-size:19px;fill:#182c28;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram-image-pipeline .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram-image-pipeline .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram-image-pipeline .error-icon{fill:#ffffff;}#diagram-image-pipeline .error-text{fill:#000000;stroke:#000000;}#diagram-image-pipeline .edge-thickness-normal{stroke-width:1px;}#diagram-image-pipeline .edge-thickness-thick{stroke-width:3.5px;}#diagram-image-pipeline .edge-pattern-solid{stroke-dasharray:0;}#diagram-image-pipeline .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram-image-pipeline .edge-pattern-dashed{stroke-dasharray:3;}#diagram-image-pipeline .edge-pattern-dotted{stroke-dasharray:2;}#diagram-image-pipeline .marker{fill:#405952;stroke:#405952;}#diagram-image-pipeline .marker.cross{stroke:#405952;}#diagram-image-pipeline svg{font-family:Hiragino Kaku Gothic ProN,Noto Sans CJK JP,sans-serif;font-size:19px;}#diagram-image-pipeline p{margin:0;}#diagram-image-pipeline .label{font-family:Hiragino Kaku Gothic ProN,Noto Sans CJK JP,sans-serif;color:#182c28;}#diagram-image-pipeline .cluster-label text{fill:#000000;}#diagram-image-pipeline .cluster-label span{color:#000000;}#diagram-image-pipeline .cluster-label span p{background-color:transparent;}#diagram-image-pipeline .label text,#diagram-image-pipeline span{fill:#182c28;color:#182c28;}#diagram-image-pipeline .node rect,#diagram-image-pipeline .node circle,#diagram-image-pipeline .node ellipse,#diagram-image-pipeline .node polygon,#diagram-image-pipeline .node path{fill:#edf3f1;stroke:#42665d;stroke-width:1px;}#diagram-image-pipeline .rough-node .label text,#diagram-image-pipeline .node .label text,#diagram-image-pipeline .image-shape .label,#diagram-image-pipeline .icon-shape .label{text-anchor:middle;}#diagram-image-pipeline .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagram-image-pipeline .rough-node .label,#diagram-image-pipeline .node .label,#diagram-image-pipeline .image-shape .label,#diagram-image-pipeline .icon-shape .label{text-align:center;}#diagram-image-pipeline .node.clickable{cursor:pointer;}#diagram-image-pipeline .root .anchor path{fill:#405952!important;stroke-width:0;stroke:#405952;}#diagram-image-pipeline .arrowheadPath{fill:#0b0b0b;}#diagram-image-pipeline .edgePaths .path{stroke:#405952;stroke-width:1px;}#diagram-image-pipeline .flowchart-link{stroke:#405952;fill:none;}#diagram-image-pipeline .edgeLabel{background-color:#ffffff;text-align:center;}#diagram-image-pipeline .edgeLabel p{background-color:#ffffff;}#diagram-image-pipeline .edgeLabel rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#diagram-image-pipeline .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#diagram-image-pipeline .cluster rect{fill:#ffffff;stroke:hsl(0, 0%, 90%);stroke-width:1px;}#diagram-image-pipeline .cluster text{fill:#000000;}#diagram-image-pipeline .cluster span{color:#000000;}#diagram-image-pipeline .node .collapsed-indicator{fill:hsl(0, 0%, 90%);stroke:none;opacity:0.6;}#diagram-image-pipeline .node .collapsed-separator{stroke:hsl(0, 0%, 90%);stroke-width:0.75px;}#diagram-image-pipeline div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Hiragino Kaku Gothic ProN,Noto Sans CJK JP,sans-serif;font-size:12px;background:#ffffff;border:1px solid hsl(0, 0%, 90%);border-radius:2px;pointer-events:none;z-index:100;}#diagram-image-pipeline .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#182c28;}#diagram-image-pipeline rect.text{fill:none;stroke-width:0;}#diagram-image-pipeline .icon-shape,#diagram-image-pipeline .image-shape{background-color:#ffffff;text-align:center;}#diagram-image-pipeline .icon-shape p,#diagram-image-pipeline .image-shape p{background-color:#ffffff;padding:2px;}#diagram-image-pipeline .icon-shape .label rect,#diagram-image-pipeline .image-shape .label rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#diagram-image-pipeline .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#diagram-image-pipeline .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#diagram-image-pipeline .node .neo-node{stroke:#42665d;}#diagram-image-pipeline [data-look="neo"].node rect,#diagram-image-pipeline [data-look="neo"].cluster rect,#diagram-image-pipeline [data-look="neo"].node polygon{stroke:url(#diagram-image-pipeline-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram-image-pipeline [data-look="neo"].swimlane.cluster rect{filter:none;}#diagram-image-pipeline [data-look="neo"].node path{stroke:url(#diagram-image-pipeline-gradient);stroke-width:1px;}#diagram-image-pipeline [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram-image-pipeline [data-look="neo"].node .neo-line path{stroke:#42665d;filter:none;}#diagram-image-pipeline [data-look="neo"].node circle{stroke:url(#diagram-image-pipeline-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram-image-pipeline [data-look="neo"].node circle .state-start{fill:#000000;}#d