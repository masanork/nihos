<svg id="diagram-priority-cursors" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 464.312px; background-color: white;" viewBox="4 4 464.3125 329.79998779296875" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-diagram-priority-cursors" aria-labelledby="chart-title-diagram-priority-cursors"><title id="chart-title-diagram-priority-cursors">優先度ごとに、前回の選択位置を覚える</title><desc id="chart-desc-diagram-priority-cursors">高優先度Hを選んでも、低優先度AとBを巡回するcursorは変更しない。Hがblockして低優先度を選べる機会が来たら、Aの次にBを選べる。</desc><style>#diagram-priority-cursors{font-family:Hiragino Kaku Gothic ProN,Noto Sans CJK JP,sans-serif;font-size:19px;fill:#182c28;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram-priority-cursors .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram-priority-cursors .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram-priority-cursors .error-icon{fill:#ffffff;}#diagram-priority-cursors .error-text{fill:#000000;stroke:#000000;}#diagram-priority-cursors .edge-thickness-normal{stroke-width:1px;}#diagram-priority-cursors .edge-thickness-thick{stroke-width:3.5px;}#diagram-priority-cursors .edge-pattern-solid{stroke-dasharray:0;}#diagram-priority-cursors .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram-priority-cursors .edge-pattern-dashed{stroke-dasharray:3;}#diagram-priority-cursors .edge-pattern-dotted{stroke-dasharray:2;}#diagram-priority-cursors .marker{fill:#405952;stroke:#405952;}#diagram-priority-cursors .marker.cross{stroke:#405952;}#diagram-priority-cursors svg{font-family:Hiragino Kaku Gothic ProN,Noto Sans CJK JP,sans-serif;font-size:19px;}#diagram-priority-cursors p{margin:0;}#diagram-priority-cursors .label{font-family:Hiragino Kaku Gothic ProN,Noto Sans CJK JP,sans-serif;color:#182c28;}#diagram-priority-cursors .cluster-label text{fill:#000000;}#diagram-priority-cursors .cluster-label span{color:#000000;}#diagram-priority-cursors .cluster-label span p{background-color:transparent;}#diagram-priority-cursors .label text,#diagram-priority-cursors span{fill:#182c28;color:#182c28;}#diagram-priority-cursors .node rect,#diagram-priority-cursors .node circle,#diagram-priority-cursors .node ellipse,#diagram-priority-cursors .node polygon,#diagram-priority-cursors .node path{fill:#edf3f1;stroke:#42665d;stroke-width:1px;}#diagram-priority-cursors .rough-node .label text,#diagram-priority-cursors .node .label text,#diagram-priority-cursors .image-shape .label,#diagram-priority-cursors .icon-shape .label{text-anchor:middle;}#diagram-priority-cursors .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagram-priority-cursors .rough-node .label,#diagram-priority-cursors .node .label,#diagram-priority-cursors .image-shape .label,#diagram-priority-cursors .icon-shape .label{text-align:center;}#diagram-priority-cursors .node.clickable{cursor:pointer;}#diagram-priority-cursors .root .anchor path{fill:#405952!important;stroke-width:0;stroke:#405952;}#diagram-priority-cursors .arrowheadPath{fill:#0b0b0b;}#diagram-priority-cursors .edgePaths .path{stroke:#405952;stroke-width:1px;}#diagram-priority-cursors .flowchart-link{stroke:#405952;fill:none;}#diagram-priority-cursors .edgeLabel{background-color:#ffffff;text-align:center;}#diagram-priority-cursors .edgeLabel p{background-color:#ffffff;}#diagram-priority-cursors .edgeLabel rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#diagram-priority-cursors .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#diagram-priority-cursors .cluster rect{fill:#ffffff;stroke:hsl(0, 0%, 90%);stroke-width:1px;}#diagram-priority-cursors .cluster text{fill:#000000;}#diagram-priority-cursors .cluster span{color:#000000;}#diagram-priority-cursors .n