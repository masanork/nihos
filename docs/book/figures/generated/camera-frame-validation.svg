<svg id="diagram-camera-frame-validation" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 629.5px; background-color: white;" viewBox="4 4 629.5 245.89999389648438" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-diagram-camera-frame-validation" aria-labelledby="chart-title-diagram-camera-frame-validation"><title id="chart-title-diagram-camera-frame-validation">転送を終えた画像を、公開する前に選別する</title><desc id="chart-desc-diagram-camera-frame-validation">正常なDMA完了は連続不完全回数をゼロにしてプールへ渡す。DMA完了とDISCARDだけなら三回まで公開せず再転送し、それ以外の異常と四回目は停止する。貸出し中の領域は保持する。</desc><style>#diagram-camera-frame-validation{font-family:Hiragino Kaku Gothic ProN,Noto Sans CJK JP,sans-serif;font-size:19px;fill:#182c28;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram-camera-frame-validation .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram-camera-frame-validation .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram-camera-frame-validation .error-icon{fill:#ffffff;}#diagram-camera-frame-validation .error-text{fill:#000000;stroke:#000000;}#diagram-camera-frame-validation .edge-thickness-normal{stroke-width:1px;}#diagram-camera-frame-validation .edge-thickness-thick{stroke-width:3.5px;}#diagram-camera-frame-validation .edge-pattern-solid{stroke-dasharray:0;}#diagram-camera-frame-validation .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram-camera-frame-validation .edge-pattern-dashed{stroke-dasharray:3;}#diagram-camera-frame-validation .edge-pattern-dotted{stroke-dasharray:2;}#diagram-camera-frame-validation .marker{fill:#405952;stroke:#405952;}#diagram-camera-frame-validation .marker.cross{stroke:#405952;}#diagram-camera-frame-validation svg{font-fam