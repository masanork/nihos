name: xy GPUI shared graphics
on:
  pull_request:
    paths:
      - 'apps/xy-gpui/**'
      - 'src/app/**'
      - 'src/gpui_host.zig'
      - 'src/graphics/**'
      - 'src/xy/**'
      - 'include/xy_animation.h'
      - 'include/nihos_app.h'
      - 'tools/*xy*gpui*'
      - 'tools/build-xy-emulator-fixture.sh'
      - 'tools/build-native*.sh'
      - 'src/platform/native/**'
      - 'src/board/tab5/**'
      - 'src/soc/esp32p4/**'
      - 'ports/esp32p4-native/**'
      - 'tools/check-xy-animation.sh'
      - 'tools/probes/animation.zig'
      - 'tools/probes/app_protocol.c'
      - 'tools/probes/xy_app_scheme.zig'
      - '.github/workflows/xy-gpui.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xy-gpui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firmware:
    name: Build desktop emulator guest
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: espressif/install-esp-idf-action@8fc05d1470d5591417e7a3707a1f2bec178db4ae
        with:
          version: v5.4.4
      - name: Build and audit display-capable xy guest
        run: sh tools/build-xy-emulator-fixture.sh
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: xy-desktop-emulator-guest
          path: build/xy-emulator-firmware/nihos-native.elf
          if-no-files-found: error
  gpui-linux:
    name: Linux GPUI emulator
    needs: firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
      NIHOS_EMU_TEST_ELF: ${{ github.workspace }}/build/xy-emulator-firmware/nihos-native.elf
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install Linux development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libfontconfig1-dev libfreetype6-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libssl-dev libasound2-dev libudev-dev
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: xy-desktop-emulator-guest
          path: build/xy-emulator-firmware
      - name: Build Linux application
        run: sh tools/build-xy-gpui.sh
      - name: Emulator unit and guest integration tests
        run: |
          cargo test --locked --manifest-path apps/xy-gpui/Cargo.toml
          cargo test --locked --manifest-path apps/xy-gpui/Cargo.toml firmware_reaches_splash -- --ignored
          cargo test --locked --manifest-path apps/xy-gpui/Cargo.toml firmware_reaches_xy_ready -- --ignored
          cargo test --locked --manifest-path apps/xy-gpui/Cargo.toml worker_boots_guest_and_handles_pause -- --ignored
          cargo test --locked --manifest-path apps/xy-gpui/Cargo.toml two_sessions_boot_edit_and_reset_independently -- --ignored
      - name: Shared renderer snapshots
        run: build/xy-gpui/xy-gpui --snapshot-dir build/xy-gpui/snapshots
  gpui:
    name: Shared animation and GPUI host
    needs: firmware
    runs-on: macos-15
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Install the validated Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: xy-desktop-emulator-guest
          path: build/xy-emulator-firmware
      - name: Pure clock and RV32 soft-float link
        run: sh tools/check-xy-animation.sh
      - name: Build GPUI over the common Zig renderer
        run: sh tools/build-xy-gpui.sh
      - name: Rust formatting and lints
        run: |
          cargo fmt --manifest-path apps/xy-gpui/Cargo.toml --check
          cargo clippy --locked --manifest-path apps/xy-gpui/Cargo.toml --no-deps -- -D warnings
      - name: Emulator unit and boot/session integration tests
        env:
          NIHOS_EMU_TEST_ELF: ${{ github.workspace }}/build/xy-emulator-firmware/nihos-native.elf
        run: |
          cargo test --locked --manifest-path apps/xy-gpui/Cargo.toml
          cargo test --locked --manifest-path apps/xy-gpui/Cargo.toml firmware_reaches_splash -- --ignored
          cargo test --locked --manifest-path apps/xy-gpui/Cargo.toml firmware_reaches_xy_ready -- --ignored
          cargo test --locked --manifest-path apps/xy-gpui/Cargo.toml worker_boots_guest_and_handles_pause -- --ignored
          cargo test --locked --manifest-path apps/xy-gpui/Cargo.toml touch_tap_reaches_xy_home -- --ignored
          cargo test --locked --manifest-path apps/xy-gpui/Cargo.toml absent_keyboard_selects_portrait -- --ignored
          cargo test --locked --manifest-path apps/xy-gpui/Cargo.toml portrait_touch_opens_document_and_types -- --ignored
          cargo test --locked --manifest-path apps/xy-gpui/Cargo.toml two_sessions_boot_edit_and_reset_independently -- --ignored
      - name: Canonical pixels, pause, input and editor undo
        run: build/xy-gpui/xy-gpui.app/Contents/MacOS/xy-gpui --snapshot-dir build/xy-gpui/snapshots
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: xy-gpui-common-core
          path: build/xy-gpui/snapshots
          if-no-files-found: ignore
