name: Reusable experimental Tab5 build provenance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Experimental Tab5 build provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      # This public CI artifact must not embed private Wi-Fi credentials.
      NIHOS_C6_WIFI_CONFIG: ''
      NIHOS_IDF_PATH: ''
      NIHOS_ZIG: ${{ github.workspace }}/.tools/zig-0.17.0/zig
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install ESP-IDF 5.4.4
        uses: espressif/install-esp-idf-action@8fc05d1470d5591417e7a3707a1f2bec178db4ae
        with:
          version: v5.4.4
          eim-version: v0.20.1

      - name: Build and audit the normal device image
        run: |
          sh tools/bootstrap-zig.sh
          python3 tools/native_build_tool_evidence.py capture --zig "$NIHOS_ZIG" --idf "$IDF_PATH" --receipt "$RUNNER_TEMP/native-tool-evidence.json"
          sh tools/build-native.sh device
          python3 tools/native_build_tool_evidence.py check --zig "$NIHOS_ZIG" --idf "$IDF_PATH" --receipt "$RUNNER_TEMP/native-tool-evidence.json"
          python3 -m unittest discover -s tools -p 'supply_chain_bom_test.py'
          python3 -m unittest discover -s tools -p 'verify_native_provenance_test.py'
          python3 -m unittest discover -s tools -p 'native_build_tool_evidence_test.py'
          python3 tools/supply_chain_bom.py build/native-device-network-devices-camera-sqld build/native-device-network-devices-camera-sqld/bom --tool-evidence "$RUNNER_TEMP/native-tool-evidence.json"

      - name: Attest image and inventory documents
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/native-device-network-devices-camera-sqld/nihos-native-flash.bin
            build/native-device-network-devices-camera-sqld/bom/*.cdx.json

      - name: Verify signed subjects and reject a modified image
        run: |
          dir=build/native-device-network-devices-camera-sqld
          for file in "$dir/nihos-native-flash.bin" "$dir"/bom/*.cdx.json; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/native-provenance.yml" \
              --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
          if gh attestation verify "$dir/nihos-native-flash.bin" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/native.yml" \
              --source-digest "$GITHUB_SHA" --deny-self-hosted-runners; then
            echo 'Unexpected caller workflow passed signer verification' >&2
            exit 1
          fi
          python3 tools/verify_native_provenance.py "$dir" \
            --source-sha "$GITHUB_SHA" --source-ref "$GITHUB_REF" --require-image-layout --require-audit-evidence --require-build-tool-evidence
          cp "$dir/image-audit.json" "$RUNNER_TEMP/original-image-audit.json"
          printf ' ' >> "$dir/image-audit.json"
          if python3 tools/verify_native_provenance.py "$dir" \
              --source-sha "$GITHUB_SHA" --source-ref "$GITHUB_REF" --require-audit-evidence; then
            echo 'Modified image audit unexpectedly passed verification' >&2
            exit 1
          fi
          mv "$RUNNER_TEMP/original-image-audit.json" "$dir/image-audit.json"
          cp "$dir/nihos-native-flash.bin" "$RUNNER_TEMP/modified.bin"
          printf x >> "$RUNNER_TEMP/modified.bin"
          if gh attestation verify "$RUNNER_TEMP/modified.bin" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/native-provenance.yml" \
              --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA" --deny-self-hosted-runners; then
            echo 'Modified image unexpectedly passed verification' >&2
            exit 1
          fi

      - name: Retain signed build evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: experimental-tab5-provenance
          path: |
            build/native-device-network-devices-camera-sqld/nihos-native-flash.bin
            build/native-device-network-devices-camera-sqld/nihos-native.elf
            build/native-device-network-devices-camera-sqld/image-audit.json
            build/native-device-network-devices-camera-sqld/bom/*.cdx.json
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
