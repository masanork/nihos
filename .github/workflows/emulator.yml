name: Emulator

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esp32p4-smoke:
    name: ESP32-P4 core smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install ESP-IDF 5.4.4
        uses: espressif/install-esp-idf-action@8fc05d1470d5591417e7a3707a1f2bec178db4ae
        with:
          version: v5.4.4

      - name: Boot core smoke in ESP-EMU
        run: sh tools/run-esp-emu-smoke.sh
