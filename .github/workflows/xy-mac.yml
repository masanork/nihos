name: xy Mac workspace
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: xy-mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Build the shared-core Mac app
        run: sh tools/build-xy-mac.sh
      - name: SQLite lifecycle and canonical framebuffer parity
        run: python3 tools/xy_workspace_test.py -v
      - name: Offline reading pack and shared-core pagination
        run: python3 tools/xy_reader_test.py -v
      - name: Structured SICP and native catalogue contracts
        run: python3 tools/xy_sicp_test.py -v
      - name: Build the Tab5 reader preview
        run: sh tools/build-xy-tab5-preview.sh
      - name: Tab5 navigation, touch, and offline pagination
        run: python3 tools/xy_tab5_reader_test.py -v
      - name: Interactive SICP drafts, isolated evaluation, and return to book
        run: python3 tools/xy_learning_test.py -v
