name: FatFs read-only host

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fatfs-host.yml'
      - 'probes/fatfs/**'
      - 'tools/bootstrap-fatfs.py'
      - 'tools/run-fatfs-host.py'
      - 'provenance.toml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/fatfs-host.yml'
      - 'probes/fatfs/**'
      - 'tools/bootstrap-fatfs.py'
      - 'tools/run-fatfs-host.py'
      - 'provenance.toml'

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install independent filesystem checkers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dosfstools exfatprogs
      - name: Read-only images, failure probes and sanitizers
        env:
          CC: clang
        run: python3 tools/run-fatfs-host.py --require-oracles
      - name: Retain JSON evidence without image payloads
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fatfs-read-only-host
          path: |
            build/fatfs-host/**/results.json
            build/fatfs-host/**/failure.json
          if-no-files-found: warn
