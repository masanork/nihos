name: Native boot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  # Preserve the preceding commit's qualification instead of wasting its run.
  cancel-in-progress: false

jobs:
  native-smp:
    name: Native SRAM boot and SMP
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install ESP-IDF 5.4.4 (bootloader tools only)
        uses: espressif/install-esp-idf-action@8fc05d1470d5591417e7a3707a1f2bec178db4ae
        with:
          version: v5.4.4

      - name: Check smoke log validator regressions
        run: python3 -m unittest discover -s tools -p 'native*_test.py'

      - name: Integer native boot without external RAM
        run: sh tools/run-native-smoke.sh

      - name: Floating native boot without external RAM
        run: sh tools/run-native-smoke.sh floating

      - name: Compiled Zig and C ILP32F tasks without external RAM
        run: sh tools/run-native-smoke.sh compiled

      - name: Native PSRAM heaps and deferred task resource cleanup
        run: |
          for size in 4M 8M 16M 32M 64M; do
            sh tools/run-native-smoke.sh integer "$size"
          done
          sh tools/run-native-smoke.sh compiled 32M

      - name: Native SQLite Flash execution and stack qualification
        run: |
          sh tools/run-native-smoke.sh sqlite 0
          sh tools/run-native-smoke.sh sqlite 4M
          sh tools/run-native-smoke.sh sqlite 32M

      - name: Build physical Tab5 revision 1.x image
        run: |
          sh tools/build-native.sh device
          sh tools/build-native.sh device floating
          sh tools/build-native.sh device compiled
          sh tools/build-native.sh device sqlite

      - name: Link and audit native FatFs RPC fixture (no device execution)
        env:
          NIHOS_NATIVE_FATFS_RPC: '1'
          NIHOS_NATIVE_COLD_FLASH: '1'
          NIHOS_NATIVE_MEMORY_BROKER: '1'
          NIHOS_NATIVE_HIGH_SRAM: '1'
          NIHOS_NATIVE_SDMMC: '1'
          NIHOS_NATIVE_SDMMC_PROFILE: '2'
          NIHOS_NATIVE_STORAGE: '1'
          NIHOS_NATIVE_STORAGE_SERVICE: '1'
        run: |
          sh tools/build-native-elf.sh device build/native-fatfs-fixture sqlite
          python3 tools/check-fatfs-native-input.py build/native-fatfs-fixture/fatfs-fixture-manifest.json
          . "$IDF_PATH/export.sh" >/dev/null
          python3 tools/check-native-call-stack.py build/native-fatfs-fixture/nihos-native.elf \
            build/native-fatfs-fixture/call-stack.json --objdump riscv32-esp-elf-objdump \
            --derive-frames --candidate-edge disk_read:nih_fatfs_fixture_read

      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-boot-evidence
          path: |
            build/native-*/image-audit.json
            build/native-*/fatfs-link-audit.json
            build/native-*/call-stack.json
            build/native-*/fatfs-fixture-manifest.json
            build/native-*/c-decode-*/result.json
            build/native-*/sqlite-manifest.json
            build/native-*/native-layout.ld
            build/native-*/loader/bootloader/bootloader.elf
            build/native-*/loader/config/sdkconfig.h
            build/native-*/nihos-native.elf
            build/native-*/nihos-native.bin
            build/native-*/nihos-native-flash.bin
            build/native-emulator*/emulator.log
            build/native-emulator*/smoke-report.json
            build/native-emulator*/psram-*/emulator.log
            build/native-emulator*/psram-*/smoke-report.json
            build/native-emulator*/psram-*/image-audit.json
            build/native-emulator*/psram-*/sqlite-manifest.json
            build/native-emulator*/psram-*/native-layout.ld
            build/native-emulator*/psram-*/nihos-native.elf
            build/native-emulator*/psram-*/nihos-native.bin
            build/native-emulator*/psram-*/nihos-native-flash.bin
          if-no-files-found: warn
