name: SSH host interoperability

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  openssh-slirp:
    name: OpenSSH over experimental TCP
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install host test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libslirp-dev openssh-server pkg-config
          sudo mkdir -p /run/sshd
      - name: Install pinned Zig
        run: sh tools/bootstrap-zig.sh
      - name: Bridge failure and backpressure semantics
        run: python3 tools/test_ssh_bridge_errors.py
      - name: TCP loss and FIN interoperability
        run: |
          SLIRP_PREFIX=/usr SLIRP_LIBDIR="$(pkg-config --variable=libdir slirp)" \
            sh tools/run-tcp-slirp-probe.sh
      - name: OpenSSH interactive PTY over experimental TCP
        run: |
          SLIRP_PREFIX=/usr SLIRP_LIBDIR="$(pkg-config --variable=libdir slirp)" \
            NIHOS_SSH_SLIRP=1 python3 tools/ssh_openssh_probe.py
      - name: OpenSSH PTY with automatic identification and key exchange
        run: |
          SLIRP_PREFIX=/usr SLIRP_LIBDIR="$(pkg-config --variable=libdir slirp)" \
            NIHOS_SSH_SLIRP=1 NIHOS_SSH_AUTOIDENT=1 NIHOS_SSH_AUTOKEX=1 python3 tools/ssh_openssh_probe.py
      - name: Automatic key exchange rejects wrong host pin
        run: NIHOS_SSH_AUTOKEX=1 NIHOS_SSH_BADPIN=1 python3 tools/ssh_openssh_probe.py
      - name: OpenSSH PTY through connection driver
        run: |
          SLIRP_PREFIX=/usr SLIRP_LIBDIR="$(pkg-config --variable=libdir slirp)" \
            NIHOS_SSH_SLIRP=1 NIHOS_SSH_AUTOCONNECT=1 python3 tools/ssh_openssh_probe.py
      - name: Connection driver rejects wrong host pin
        run: NIHOS_SSH_AUTOCONNECT=1 NIHOS_SSH_BADPIN=1 python3 tools/ssh_openssh_probe.py
      - name: OpenSSH interactive shell through client driver
        run: |
          SLIRP_PREFIX=/usr SLIRP_LIBDIR="$(pkg-config --variable=libdir slirp)" \
            NIHOS_SSH_SLIRP=1 NIHOS_SSH_AUTOCLIENT=1 python3 tools/ssh_openssh_probe.py
      - name: Client driver rejects wrong host pin and unauthorized key
        run: |
          NIHOS_SSH_AUTOCLIENT=1 NIHOS_SSH_BADPIN=1 python3 tools/ssh_openssh_probe.py
          NIHOS_SSH_AUTOCLIENT=1 NIHOS_SSH_BADAUTH=1 python3 tools/ssh_openssh_probe.py
      - name: Terminal receive credit beyond initial SSH window
        run: NIHOS_SSH_AUTOCLIENT=1 NIHOS_SSH_LARGE_OUTPUT=1 python3 tools/ssh_openssh_probe.py
      - name: Hosted TCP session owner with interactive OpenSSH
        run: |
          SLIRP_PREFIX=/usr SLIRP_LIBDIR="$(pkg-config --variable=libdir slirp)" \
            NIHOS_SSH_SLIRP=1 NIHOS_SSH_HOSTED_SESSION=1 python3 tools/ssh_openssh_probe.py
      - name: OpenSSH through xy VT and Hosted session
        run: |
          SLIRP_PREFIX=/usr SLIRP_LIBDIR="$(pkg-config --variable=libdir slirp)" \
            NIHOS_SSH_SLIRP=1 NIHOS_SSH_HOSTED_VT=1 python3 tools/ssh_openssh_probe.py
