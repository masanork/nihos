name: Native USB and card service

on:
  push:
    paths:
      - '.github/workflows/usb.yml'
      - 'src/**'
      - 'build.zig'
      - 'provenance.toml'
      - 'probes/usb*/**'
      - 'probes/photo/**'
      - 'probes/card*/**'
      - 'probes/display_notice/**'
      - 'probes/audio_native/**'
      - 'probes/microphone_native/**'
      - 'probes/rs485_native/**'
      - 'tools/check-rs485-shim.py'
      - 'tools/rs485-peer.py'
      - 'tools/check-audio-shim.py'
      - 'tools/*photo*'
      - 'tools/*auto*'
      - 'tools/*license*'
      - 'tools/*font*'
      - 'tools/boot-graphics/*card*'
      - 'tools/generate-jis0208.py'
      - 'tools/bootstrap-openjpeg.sh'
      - 'tools/build-native*.sh'
      - 'tools/run-static-analysis.sh'
      - 'tools/check-card-rv32.sh'
      - 'tools/check-native*.py'
      - 'tools/native*_test.py'
      - 'tools/xy_camera*.py'
      - 'tools/normal_fs_*.py'
      - 'tools/check-normal*.py'
      - 'probes/normal-fs/**'
      - 'probes/sdmmc/**'
      - 'probes/c6-sdio/**'
      - 'ports/esp32p4-native/**'
  pull_request:
    paths:
      - '.github/workflows/usb.yml'
      - 'src/**'
      - 'build.zig'
      - 'provenance.toml'
      - 'probes/usb*/**'
      - 'probes/photo/**'
      - 'probes/card*/**'
      - 'probes/display_notice/**'
      - 'probes/audio_native/**'
      - 'probes/microphone_native/**'
      - 'probes/rs485_native/**'
      - 'tools/check-rs485-shim.py'
      - 'tools/rs485-peer.py'
      - 'tools/check-audio-shim.py'
      - 'tools/*photo*'
      - 'tools/*auto*'
      - 'tools/*license*'
      - 'tools/*font*'
      - 'tools/boot-graphics/*card*'
      - 'tools/generate-jis0208.py'
      - 'tools/bootstrap-openjpeg.sh'
      - 'tools/build-native*.sh'
      - 'tools/run-static-analysis.sh'
      - 'tools/check-card-rv32.sh'
      - 'tools/check-native*.py'
      - 'tools/native*_test.py'
      - 'tools/xy_camera*.py'
      - 'tools/normal_fs_*.py'
      - 'tools/check-normal*.py'
      - 'probes/normal-fs/**'
      - 'probes/sdmmc/**'
      - 'probes/c6-sdio/**'
      - 'ports/esp32p4-native/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-usb:
    name: Host checks and device build configurations
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install ESP-IDF 5.4.4 headers and bootloader tools
        uses: espressif/install-esp-idf-action@8fc05d1470d5591417e7a3707a1f2bec178db4ae
        with:
          version: v5.4.4

      - name: Static analysis and default RV32 links
        run: sh tools/run-static-analysis.sh

      - name: Host models and evidence checker regressions
        run: |
          .tools/zig-0.17.0/zig build test
          .tools/zig-0.17.0/zig build test -Doptimize=ReleaseSafe
          sh tools/check-card-rv32.sh
          sh tools/build-xy-tab5-preview.sh
          python3 -m unittest discover -s tools -p '*test.py'

      - name: Bounded image decoder with sanitizers
        run: sh tools/check-photo-codec.sh

      - name: Preserve normal boot health and failure handling
        # Headless emulator execution; no optical or physical-device claim.
        run: python3 tools/run-native-boot-smoke.py

      - name: Compile PIN-free probes, keypad and local card-read images
        # Build/image audit only. GitHub runners provide no Tab5/card evidence.
        run: |
          for feature in disabled usb jpki card touch keypad card-read card-photo card-auto card-auto-probe card-scene; do
            export NIHOS_NATIVE_USB=0 NIHOS_NATIVE_JPKI=0 NIHOS_NATIVE_DISPLAY=0 NIHOS_NATIVE_CARD_CHECK=0 NIHOS_NATIVE_TOUCH_CHECK=0 NIHOS_NATIVE_CARD_AUTO_PROBE=0 NIHOS_NATIVE_CARD_SCENE_EXERCISE=0
            case "$feature" in
              usb) export NIHOS_NATIVE_USB=1 ;;
              jpki) export NIHOS_NATIVE_USB=1 NIHOS_NATIVE_JPKI=1 ;;
              card) export NIHOS_NATIVE_USB=1 NIHOS_NATIVE_DISPLAY=1 NIHOS_NATIVE_CARD_CHECK=1 ;;
              touch) export NIHOS_NATIVE_DISPLAY=6 NIHOS_NATIVE_TOUCH_CHECK=1 ;;
              keypad) export NIHOS_NATIVE_DISPLAY=8 ;;
              card-read) export NIHOS_NATIVE_USB=1 NIHOS_NATIVE_DISPLAY=9 ;;
              card-photo) export NIHOS_NATIVE_USB=1 NIHOS_NATIVE_DISPLAY=10 ;;
              card-auto) export NIHOS_NATIVE_USB=1 NIHOS_NATIVE_DISPLAY=11 ;;
              card-auto-probe) export NIHOS_NATIVE_USB=1 NIHOS_NATIVE_DISPLAY=11 NIHOS_NATIVE_CARD_AUTO_PROBE=1 ;;
              card-scene) export NIHOS_NATIVE_USB=1 NIHOS_NATIVE_DISPLAY=11 NIHOS_NATIVE_CARD_AUTO_PROBE=1 NIHOS_NATIVE_CARD_SCENE_EXERCISE=1 ;;
            esac
            sh tools/build-native.sh device integer
            destination="build/usb-ci/$feature"
            mkdir -p "$destination"
            cp build/native-device/nihos-native.elf \
               build/native-device/nihos-native.bin \
               build/native-device/image-audit.json \
               build/native-device/native_options.zig \
               build/native-device/native-layout.ld \
               build/native-device/loader/bootloader/bootloader.bin \
               build/native-device/loader/bootloader/bootloader.elf \
               build/native-device/loader/config/sdkconfig.h \
               build/native-device/loader/partition_table/partition-table.bin \
               "$destination/"
            case "$feature" in
              card-photo|card-auto|card-auto-probe|card-scene)
                cp build/native-device/photo-manifest.json "$destination/"
                ;;
            esac
          done

      - name: Compile normal splash and live-console configuration
        run: |
          NIHOS_NATIVE_NETWORK=0 NIHOS_NATIVE_DISPLAY=2 NIHOS_NATIVE_PSRAM_200=1 NIHOS_NATIVE_CONSOLE=1 \
            NIHOS_NATIVE_CONSOLE_LIVE=1 NIHOS_NATIVE_KEYBOARD_I2C=1 \
            sh tools/build-native.sh device integer
          mkdir -p build/usb-ci/normal-display
          cp build/native-device-devices-camera/image-audit.json build/native-device-devices-camera/native_options.zig build/usb-ci/normal-display/

      - name: Compile default connected Tab5 OS
        run: |
          sh tools/build-native.sh device integer
          grep -Fx 'pub const keyboard_i2c = true;' build/native-device-network-devices-camera/native_options.zig
          mkdir -p build/usb-ci/default-connected
          cp build/native-device-network-devices-camera/nihos-native.elf \
             build/native-device-network-devices-camera/nihos-native.bin \
             build/native-device-network-devices-camera/image-audit.json \
             build/native-device-network-devices-camera/native_options.zig \
             build/native-device-network-devices-camera/normal-fs-manifest.json \
             build/native-device-network-devices-camera/network-receipt.json build/usb-ci/default-connected/
          NIHOS_NATIVE_DEVICES=0 NIHOS_NATIVE_NORMAL_STORAGE=0 sh tools/build-native.sh device integer
          mkdir -p build/usb-ci/drivers-disabled
          cp build/native-device-network/image-audit.json build/native-device-network/native_options.zig build/usb-ci/drivers-disabled/

      - name: Compile ordinary read-only FS with C6 and display, and without networking
        run: |
          NIHOS_NATIVE_NORMAL_STORAGE=1 sh tools/build-native.sh device integer
          python3 tools/check-normal-native.py build/native-device-network-devices-camera
          mkdir -p build/usb-ci/normal-fs
          cp build/native-device-network-devices-camera/nihos-native.elf \
             build/native-device-network-devices-camera/nihos-native.bin \
             build/native-device-network-devices-camera/image-audit.json \
             build/native-device-network-devices-camera/normal-fs-manifest.json \
             build/native-device-network-devices-camera/normal-fs-negative-controls.json \
             build/native-device-network-devices-camera/native_options.zig build/usb-ci/normal-fs/
          NIHOS_NATIVE_NORMAL_STORAGE=1 NIHOS_NATIVE_NETWORK=0 sh tools/build-native.sh device integer
          mkdir -p build/usb-ci/normal-fs-no-network
          cp build/native-device-devices-camera/image-audit.json build/native-device-devices-camera/native_options.zig build/usb-ci/normal-fs-no-network/

      - name: Compile opt-in finite native audio probe and reject wrong DMA base
        run: |
          NIHOS_NATIVE_AUDIO=1 sh tools/build-native.sh device
          python3 tools/check-audio-shim.py
          mkdir -p build/usb-ci/finite-audio/licenses
          cp build/native-device-network-audio/nihos-native.elf \
             build/native-device-network-audio/nihos-native.bin \
             build/native-device-network-audio/image-audit.json \
             build/native-device-network-audio/native_options.zig \
             build/native-device-network-audio/network-receipt.json \
             build/audio-shim-check/result.json build/usb-ci/finite-audio/
          cp build/native-device-network-audio/licenses/BMI270.txt build/usb-ci/finite-audio/licenses/

      - name: Compile finite microphone input and muted-control configurations
        run: |
          for muted in 0 1; do
            NIHOS_NATIVE_MICROPHONE=1 NIHOS_NATIVE_MICROPHONE_MUTED="$muted" sh tools/build-native.sh device
            python3 tools/check-audio-shim.py --microphone
            destination="build/usb-ci/finite-microphone-$muted"
            mkdir -p "$destination/licenses"
            cp build/native-device-network-microphone/nihos-native.elf \
               build/native-device-network-microphone/nihos-native.bin \
               build/native-device-network-microphone/image-audit.json \
               build/native-device-network-microphone/native_options.zig \
               build/native-device-network-microphone/network-receipt.json \
               build/microphone-shim-check/result.json "$destination/"
            cp build/native-device-network-microphone/licenses/BMI270.txt "$destination/licenses/"
          done

      - name: Compile finite RS485 internal, peer and timeout-control configurations
        run: |
          for mode in loopback peer no-loopback; do
            NIHOS_NATIVE_RS485=1 NIHOS_NATIVE_RS485_TEST="$mode" sh tools/build-native.sh device
            python3 tools/check-rs485-shim.py
            destination="build/usb-ci/rs485-$mode"
            mkdir -p "$destination/licenses"
            cp build/native-device-network-rs485/nihos-native.elf \
               build/native-device-network-rs485/nihos-native.bin \
               build/native-device-network-rs485/image-audit.json \
               build/native-device-network-rs485/native_options.zig \
               build/native-device-network-rs485/network-receipt.json \
               build/rs485-shim-check/result.json "$destination/"
            cp build/native-device-network-rs485/licenses/BMI270.txt "$destination/licenses/"
          done

      - name: Compile opt-in RGB565 and hardware JPEG fixture
        run: |
          NIHOS_NATIVE_NETWORK=0 NIHOS_NATIVE_NORMAL_STORAGE=0 NIHOS_NATIVE_DEVICES=1 \
            NIHOS_NATIVE_CAMERA_ID=1 NIHOS_NATIVE_CAMERA_DIAGNOSTICS=0 NIHOS_NATIVE_CAMERA_JPEG=1 NIHOS_NATIVE_XY_WORKSPACE=0 \
            NIHOS_NATIVE_USB=0 NIHOS_NATIVE_AUDIO=0 NIHOS_NATIVE_MICROPHONE=0 NIHOS_NATIVE_RS485=0 \
            NIHOS_NATIVE_DISPLAY=2 sh tools/build-native.sh device integer
          mkdir -p build/usb-ci/camera-jpeg
          cp build/native-device-devices-camera-jpeg/image-audit.json \
            build/native-device-devices-camera-jpeg/native_options.zig build/usb-ci/camera-jpeg/

      - name: Compile XY hardware JPEG handle API and trace
        run: |
          for trace in 0 1; do
            NIHOS_NATIVE_NETWORK=0 NIHOS_NATIVE_NORMAL_STORAGE=0 NIHOS_NATIVE_DEVICES=1 \
              NIHOS_NATIVE_CAMERA_ID=1 NIHOS_NATIVE_CAMERA_DIAGNOSTICS=0 NIHOS_NATIVE_CAMERA_JPEG=1 \
              NIHOS_NATIVE_XY_WORKSPACE=1 NIHOS_NATIVE_XY_TRACE="$trace" \
              NIHOS_NATIVE_USB=0 NIHOS_NATIVE_AUDIO=0 NIHOS_NATIVE_MICROPHONE=0 NIHOS_NATIVE_RS485=0 \
              NIHOS_NATIVE_DISPLAY=2 sh tools/build-native.sh device integer
            profile=build/native-device-devices-camera-jpeg
            if [ "$trace" = 1 ]; then profile="$profile-xy-trace"; fi
            destination="build/usb-ci/xy-camera-jpeg-$trace"
            mkdir -p "$destination"
            cp "$profile/image-audit.json" "$profile/native_options.zig" "$destination/"
          done

      - name: Retain source-bound compile evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-usb-device-builds
          path: |
            build/usb-ci/
            build/normal-boot-smoke/
          if-no-files-found: warn
