[package]
name = "nihos-xy-gpui"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[features]
experimental-meos = ["dep:sha2"]

[dependencies]
gpui = { version = "=0.2.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
rustc_apfloat = "=0.2.3"
sha2 = { version = "=0.10.9", optional = true }

[dev-dependencies]
sha2 = "=0.10.9"

[profile.dev]
debug = 0

# Keep GPUI dependencies debuggable while the instruction interpreter runs with
# useful speed in the normal development app. Runtime remains bounds checked.
[profile.dev.package.nihos-xy-gpui]
opt-level = 2
