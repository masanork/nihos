[package]
name = "nihos-xy-gpui"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
gpui = { version = "=0.2.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
debug = 0

# Keep GPUI dependencies debuggable while the instruction interpreter runs with
# useful speed in the normal development app. Runtime remains bounds checked.
[profile.dev.package.nihos-xy-gpui]
opt-level = 2
